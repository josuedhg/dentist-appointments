{% extends "appointments/base.html" %}

{% block title %}Set appointment · DentalCare{% endblock %}

{% block content %}
<div class="card" style="max-width: 640px; margin: 0 auto;">
    <h1>Set appointment</h1>
    <p class="lead">Schedule an appointment for a patient on your calendar.</p>

    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit" class="btn">Confirm appointment</button>
            <a class="btn secondary" href="{% url 'doctor-dashboard' %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
